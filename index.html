<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Interactive Problem Debugger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Consolas', 'Fira Code', Monaco, monospace;
      background-color: #181818;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 15px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #252526;
      padding: 10px 15px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    .title { font-weight: bold; font-size: 1.1rem; color: #61afef; }
    .controls { display: flex; gap: 10px; align-items: center; }
    
    select, button {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2d2d2d;
      color: #fff;
      cursor: pointer;
    }
    select:focus, button:focus, input:focus, textarea:focus { outline: none; border-color: #007acc; }
    button.run { background: #0e639c; font-weight: bold; }
    button.run:hover { background: #1177bb; }
    button.stop { background: #a31515; }
    button.stop:hover { background: #c41e1e; }
    button.clear { background: #3a3d41; }
    
    main {
      flex: 1;
      display: flex;
      gap: 15px;
      min-height: 0; /* flex崩れ防止 */
    }
    
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      overflow: hidden;
    }
    
    .panel-header {
      background: #252526;
      padding: 8px 12px;
      font-size: 0.85rem;
      color: #888;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
    }

    textarea {
      flex: 1;
      background: #1e1e1e;
      color: #d4d4d4;
      border: none;
      padding: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      line-height: 1.4;
    }

    #log {
      flex: 1;
      background: #000;
      padding: 12px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #252526;
      border-top: 1px solid #333;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .stdout { color: #98c379; font-weight: bold; } /* プログラムの出力 (緑) */
    .stdin { color: #d19a66; }                      /* あなたの入力 (橙) */
    .sys { color: #5c6370; font-style: italic; }    /* システムログ (グレー) */
  </style>
</head>
<body>

  <header>
    <div class="title">Interactive Debugger</div>
    <div class="controls">
      <select id="lang">
        <option value="cpp">C++ (g++)</option>
        <option value="python">Python3</option>
      </select>
      <button class="run" id="runBtn" onclick="runCode()">実行 (Ctrl+Enter)</button>
      <button class="stop" id="stopBtn" onclick="stopCode()" disabled>停止</button>
      <button class="clear" onclick="clearLog()">ログクリア</button>
    </div>
  </header>

  <main>
    <!-- 左側：コード入力 -->
    <div class="panel">
      <div class="panel-header">
        <span>提出コード</span>
      </div>
      <textarea id="code" placeholder="ここにコードを貼り付け..." spellcheck="false"></textarea>
    </div>

    <!-- 右側：実行ログ & 手動ジャッジ入力 -->
    <div class="panel">
      <div class="panel-header">
        <span>実行ログ / 入出力インタラクション</span>
        <span id="status">Status: Idle</span>
      </div>
      <div id="log"></div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="ジャッジの回答を入力して Enter..." onkeydown="if(event.key==='Enter') sendInput()" disabled>
        <button id="sendBtn" onclick="sendInput()" disabled>送信</button>
      </div>
    </div>
  </main>

  <script>
    let ws = null;

    function appendLog(text, className) {
      const log = document.getElementById('log');
      const div = document.createElement('div');
      div.className = className;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    function setStatus(text, color) {
      const status = document.getElementById('status');
      status.textContent = 'Status: ' + text;
      status.style.color = color || '#888';
    }

    function runCode() {
      if (ws) ws.close();
      clearLog();
      
      ws = new WebSocket(`ws://${location.host}/ws`);

      ws.onopen = () => {
        const lang = document.getElementById('lang').value;
        const code = document.getElementById('code').value;
        ws.send(JSON.stringify({ lang, code }));
        
        document.getElementById('userInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('runBtn').disabled = true;
        document.getElementById('userInput').focus();
        setStatus('Running...', '#98c379');
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'stdout') appendLog('[OUT] ' + data.msg, 'stdout');
        if (data.type === 'sys') appendLog(data.msg, 'sys');
      };

      ws.onclose = () => {
        document.getElementById('userInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('runBtn').disabled = false;
        setStatus('Finished', '#888');
      };
    }

    function stopCode() {
      if (ws) {
        ws.close();
        appendLog('[Process Force Stopped]', 'sys');
      }
    }

    function sendInput() {
      const inputEl = document.getElementById('userInput');
      const val = inputEl.value;
      if (!val || !ws) return;

      appendLog('[IN ] ' + val, 'stdin');
      ws.send(JSON.stringify({ type: 'stdin', msg: val }));
      inputEl.value = '';
    }

    // Ctrl+Enter でコード即時実行
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') {
        runCode();
      }
    });
  </script>
</body>
</html>
